name: Dreamworld SDM845 Kernel Build

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             bc             bison             build-essential             clang-14             cpio             device-tree-compiler             flex             gcc-aarch64-linux-gnu             libelf-dev             libssl-dev             lld-14             llvm-14             python3             rsync             unzip

      - name: Show toolchain
        run: |
          clang-14 --version
          ld.lld-14 --version
          aarch64-linux-gnu-gcc --version
          make --version

      - name: Prepare output
        run: |
          rm -rf out
          mkdir -p out

      - name: Configure SDM845 kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          PATH: /usr/lib/llvm-14/bin:/usr/bin:/bin
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 \
            STRIP=llvm-strip-14 sdm845-perf_defconfig

          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-14 LD=ld.lld-14 olddefconfig

      - name: Build kernel and DTBs
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          PATH: /usr/lib/llvm-14/bin:/usr/bin:/bin
        run: |
          make -j2 O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 \
            STRIP=llvm-strip-14 Image dtbs

      - name: Verify artifacts
        run: |
          test -s out/arch/arm64/boot/Image
          find out/arch/arm64/boot/dts -type f -name '*.dtb' | head -20
          ls -lh out/arch/arm64/boot/Image

      - name: Package build artifacts
        run: |
          mkdir -p artifact
          cp out/arch/arm64/boot/Image artifact/Image
          find out/arch/arm64/boot/dts -type f -name '*.dtb' -exec cp --parents {} artifact/ \;
          cp out/.config artifact/kernel.config
          tar -czf dreamworld-sdm845-4.9.337-build.tar.gz -C artifact .

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamworld-sdm845-4.9.337
          path: dreamworld-sdm845-4.9.337-build.tar.gz
          if-no-files-found: error

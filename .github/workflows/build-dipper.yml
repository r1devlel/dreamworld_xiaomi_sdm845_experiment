name: Build Xiaomi Mi 8 (dipper) kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dipper-kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile kernel (Linux 4.9 / SDM845)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git libelf-dev libssl-dev \
            clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 python-is-python3 rsync

      - name: Show source and compiler versions
        run: |
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
          clang --version
          aarch64-linux-gnu-gcc --version | head -n 1
          arm-linux-gnueabi-gcc --version | head -n 1

      - name: Configure for Xiaomi Mi 8
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out \
            ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            vendor/xiaomi/mi845_defconfig

          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/dipper.config

          make O=out \
            ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          grep -E 'CONFIG_(MACH_XIAOMI|MACH_XIAOMI_SDM845|ARCH_SDM845|BPF_SYSCALL|BUILD_ARM64_APPENDED_DTB_IMAGE)=' out/.config || true

      - name: Compile kernel and device trees
        run: |
          set -euxo pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb

          test -s out/arch/arm64/boot/Image.gz-dtb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel-lineage-23.2-${{ github.run_number }}
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/.config

name: Build Xiaomi Mi 8 (dipper) kernel

on:
  push:
    branches:
      - bpf-port-mido-stage1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dipper-kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile kernel (Linux 4.9 / SDM845 / BPF port)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential binutils-aarch64-linux-gnu cpio flex git \
            libelf-dev libncurses-dev libssl-dev libc6-dev-arm64-cross clang-18 lld-18 llvm-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 \
            rsync dwarves pahole

      - name: Show source and toolchain versions
        run: |
          set -euxo pipefail
          git rev-parse --short HEAD
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
          clang-18 --version
          ld.lld-18 --version
          llvm-nm-18 --version
          aarch64-linux-gnu-gcc --version | head -n 1
          arm-linux-gnueabi-gcc --version | head -n 1
          make --version | head -n 1

      - name: Configure for Xiaomi Mi 8
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CC=clang-18
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out \
            ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            LLVM_IAS=0 vendor/xiaomi/mi845_defconfig

          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/dipper.config

          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/droidspaces.config

          # Compile-test the optional native-entry backend only on this branch.
          scripts/config --file out/.config --enable BPF_TRAMPOLINE_NATIVE

          make O=out \
            ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            LLVM_IAS=0 olddefconfig

          echo "=== Relevant final configuration ==="
          echo "=== Required BPF and trampoline prerequisites ==="
          grep -E '^(CONFIG_(CGROUP_BPF|BPF|BPF_SYSCALL|BPF_JIT_ALWAYS_ON|NETFILTER_XT_MATCH_BPF|NET_CLS_BPF|BPF_JIT|HAVE_EBPF_JIT)=|# CONFIG_(CGROUP_BPF|BPF|BPF_SYSCALL|BPF_JIT_ALWAYS_ON|NETFILTER_XT_MATCH_BPF|NET_CLS_BPF|BPF_JIT|HAVE_EBPF_JIT) is not set)' out/.config || true
          for symbol in CONFIG_CGROUP_BPF CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_JIT_ALWAYS_ON CONFIG_NETFILTER_XT_MATCH_BPF CONFIG_NET_CLS_BPF CONFIG_BPF_JIT CONFIG_HAVE_EBPF_JIT CONFIG_TASKS_RCU CONFIG_DEBUG_INFO_BTF CONFIG_PAGE_POOL CONFIG_BPF_TRAMPOLINE_NATIVE; do
            if ! grep -qx "${symbol}=y" out/.config; then
              echo "::error::Required kernel config is missing: ${symbol}=y"
              exit 1
            fi
          done
          echo "All required BPF, BTF, and Tasks RCU prerequisites are enabled."

      - name: Compile kernel and device trees
        run: |
          set -euxo pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang-18 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            LLVM_IAS=0 V=1 Image.gz-dtb

          test -s out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          test -s out/net/core/page_pool.o
          echo "PAGE_POOL object compiled successfully."
          test -s out/kernel/bpf/trampoline.o
          test -s out/arch/arm64/net/bpf_jit_comp.o
          llvm-nm-18 out/kernel/bpf/trampoline.o | awk '{print $NF}' | grep -qx 'bpf_trampoline_lookup'
          llvm-nm-18 out/kernel/bpf/trampoline.o | awk '{print $NF}' | grep -qx 'bpf_trampoline_attach_prog'
          llvm-nm-18 out/kernel/bpf/trampoline.o | awk '{print $NF}' | grep -qx 'bpf_trampoline_detach_prog'
          llvm-nm-18 out/arch/arm64/net/bpf_jit_comp.o | awk '{print $NF}' | grep -qx 'arch_prepare_bpf_trampoline'
          echo "Generic manager, native fentry/fexit lifecycle and ARM64 generator symbols verified."

          # Check native entry patchpoints on both void and scalar-return functions.
          # This is a compiler/disassembly smoke test, not a runtime BPF attach test.
          expected_native_ops=$(printf 'nop\nnop\nnop\nnop')
          for native_target in do_exit wake_up_process; do
            native_addr=$(llvm-nm-18 -n out/vmlinux | awk -v sym="$native_target" '$3 == sym && !found { addr=$1; found=1 } END { if (found) print addr }')
            if [ -z "$native_addr" ]; then
              echo "::error::Native patchpoint smoke-test target $native_target was not found"
              exit 1
            fi
            native_start="0x$native_addr"
            native_stop=$(python3 -c 'import sys; print(hex(int(sys.argv[1], 16) + 16))' "$native_addr")
            native_ops=$(llvm-objdump-18 -d --start-address="$native_start" --stop-address="$native_stop" out/vmlinux | awk '/^[[:space:]]*[[:xdigit:]]+:/ { print $NF }')
            if [ "$native_ops" != "$expected_native_ops" ]; then
              echo "::error::Expected four NOPs at $native_target entry for native BPF fentry/fexit"
              echo "Observed entry instructions:"
              printf '%s\n' "$native_ops"
              exit 1
            fi
            echo "Native function entry patchpoint verified: $native_target begins with four NOPs."
          done

      - name: Verify embedded vmlinux BTF
        run: |
          set -euxo pipefail
          test -s out/vmlinux

          # A green build does not prove that CONFIG_DEBUG_INFO_BTF produced a
          # usable blob. The section and the boundary symbols are what
          # sysfs_btf.c uses to serve /sys/kernel/btf/vmlinux.
          llvm-readelf-18 -S out/vmlinux | grep -q '\.BTF'
          llvm-nm-18 out/vmlinux | awk '{print $NF}' | grep -qx '__start_BTF'
          llvm-nm-18 out/vmlinux | awk '{print $NF}' | grep -qx '__stop_BTF'

          llvm-objcopy-18 --dump-section .BTF=out/vmlinux.btf out/vmlinux
          btf_size=$(stat -c%s out/vmlinux.btf)
          test "$btf_size" -gt 100000
          magic=$(od -An -tx1 -N4 out/vmlinux.btf | tr -d ' \n')
          test "$magic" = "9feb0100"
          echo "Embedded vmlinux BTF verified: ${btf_size} bytes, magic ${magic}."

      - name: Diagnose BPF, RCU, and XDP build state
        if: always()
        run: |
          set +e
          echo "=== Source revision ==="
          git rev-parse --short HEAD 2>/dev/null || true

          echo "=== Native ARM64 BPF entry patchpoint config ==="
          grep -nE '^(CONFIG_BPF_TRAMPOLINE_NATIVE=|# CONFIG_BPF_TRAMPOLINE_NATIVE is not set)' out/.config 2>/dev/null || true

          echo "=== CONFIG_TASKS_RCU in out/.config ==="
          grep -nE '^(CONFIG_TASKS_RCU=|# CONFIG_TASKS_RCU is not set)' out/.config 2>/dev/null || true
          echo "=== TASKS_RCU in generated auto.conf ==="
          grep -nE 'TASKS_RCU' out/include/config/auto.conf 2>/dev/null || true

          echo "=== RCU object symbols ==="
          if test -f out/kernel/rcu/update.o; then
            llvm-nm-18 out/kernel/rcu/update.o 2>/dev/null | grep -E 'call_rcu_tasks|rcu_tasks' || true
          else
            echo "MISSING out/kernel/rcu/update.o"
          fi

          echo "=== BPF trampoline symbols ==="
          if test -s out/kernel/bpf/trampoline.o; then
            llvm-nm-18 out/kernel/bpf/trampoline.o 2>/dev/null | grep -E 'bpf_trampoline_(lookup|link_prog|unlink_prog|put)|__bpf_prog_(enter|exit)|arch_prepare_bpf_trampoline' || true
          else
            echo "MISSING out/kernel/bpf/trampoline.o"
          fi

          echo "=== Relevant object files ==="
          for f in \
            out/kernel/bpf/trampoline.o \
            out/kernel/bpf/dispatcher.o \
            out/kernel/bpf/ringbuf.o \
            out/net/core/page_pool.o \
            out/net/core/xdp.o \
            out/net/core/filter.o \
            out/net/ipv4/bpf_tcp_ca.o \
            out/net/bpf/test_run.o; do
            if test -s "$f"; then echo "PRESENT $f"; else echo "MISSING $f"; fi
          done

          echo "=== XDP definitions in source headers ==="
          grep -nE 'struct xdp_buff|xdp_set_data_meta_invalid|xdp_data_meta_unsupported' \
            include/linux/filter.h include/net/xdp.h 2>/dev/null || true

          echo "=== Expected kernel image ==="
          if test -s out/arch/arm64/boot/Image.gz-dtb; then
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          else
            echo "MISSING out/arch/arm64/boot/Image.gz-dtb"
          fi

      - name: Compile native BPF runtime selftest harness
        run: |
          set -euxo pipefail
          test_source=tools/testing/selftests/native_bpf_trampoline/native_bpf_trampoline_test.c
          gcc -O2 -Wall -Wextra -Werror "$test_source" \
            -o out/native_bpf_trampoline_test.host
          aarch64-linux-gnu-gcc -static -O2 -Wall -Wextra -Werror "$test_source" \
            -o out/native_bpf_trampoline_test.arm64
          test -s out/native_bpf_trampoline_test.host
          test -s out/native_bpf_trampoline_test.arm64
          aarch64-linux-gnu-readelf -h out/native_bpf_trampoline_test.arm64 | \
            grep -Eq 'Machine:[[:space:]]+AArch64'
          if aarch64-linux-gnu-readelf -l out/native_bpf_trampoline_test.arm64 | grep -q 'INTERP'; then
            echo "::error::Runtime selftest must be statically linked for device execution"
            exit 1
          fi
          file out/native_bpf_trampoline_test.arm64
          echo "Host compile and static AArch64 cross-compile passed; runtime execution still requires the target device."

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dipper-kernel-bpf-port-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/native_bpf_trampoline_test.arm64
            out/vmlinux.btf
            out/.config

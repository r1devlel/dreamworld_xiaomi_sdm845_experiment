name: Build Xiaomi Mi 8 (dipper) optimisasi + MGLRU

on:
  push:
    branches:
      - optimisasi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dipper-optimisasi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile (Linux 4.9 / SDM845 / optimisasi + MGLRU)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential binutils-aarch64-linux-gnu cpio flex git \
            libelf-dev libncurses-dev libssl-dev libc6-dev-arm64-cross clang-18 lld-18 llvm-18 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 \
            rsync dwarves pahole zip

      - name: Show source and toolchain versions
        run: |
          set -euxo pipefail
          git rev-parse --short HEAD
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
          test -s KernelSU/kernel/Kconfig
          test -s KernelSU/kernel/Kbuild
          test -s fs/susfs.c
          clang-18 --version
          ld.lld-18 --version
          llvm-nm-18 --version

      - name: Configure for Xiaomi Mi 8
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CC=clang-18
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out \
            ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            LLVM_IAS=0 vendor/xiaomi/mi845_defconfig

          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/dipper.config
          scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/xiaomi/bakasu.config

          make O=out \
            ARCH="$ARCH" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            LLVM_IAS=0 olddefconfig

          echo "=== MGLRU / memory / CPU / GPU / BakaSU / SUSFS final configuration ==="
          grep -E '^(CONFIG_(LRU_GEN|LRU_GEN_ENABLED|NR_LRU_GENS|TIERS_PER_GEN|ANON_MIN_RATIO|CLEAN_LOW_RATIO|CLEAN_MIN_RATIO|ZRAM|ZSMALLOC|ZRAM_WRITEBACK|ZRAM_ENTROPY|CRYPTO_LZ4|CRYPTO_ZSTD|CPU_INPUT_BOOST|INPUT_BOOST_DURATION_MS|INPUT_BOOST_FREQ_LP|INPUT_BOOST_FREQ_PERF|MAX_BOOST_FREQ_LP|MAX_BOOST_FREQ_PERF|CPU_FREQ_MIN_LP|CPU_FREQ_MIN_PERF|DEVFREQ_BOOST|DEVFREQ_INPUT_BOOST_DURATION_MS|DEVFREQ_WAKE_BOOST_DURATION_MS|DEVFREQ_MSM_CPUBW_BOOST_FREQ|CPU_FREQ_GOV_SCHEDUTIL|QCOM_KGSL|DEVFREQ_GOV_QCOM_ADRENO_TZ|IOSCHED_BFQ|MQ_IOSCHED_DEADLINE|MQ_IOSCHED_KYBER|TCP_CONG_BBR2|TCP_CONG_BBR3|KSU|KSU_SUSFS|THREAD_INFO_IN_TASK|KALLSYMS|KALLSYMS_ALL|OVERLAY_FS|KPROBES)=|# CONFIG_(KSU_MANUAL_HOOK) is not set)' out/.config || true

          for symbol in CONFIG_LRU_GEN CONFIG_LRU_GEN_ENABLED CONFIG_ZRAM CONFIG_ZSMALLOC CONFIG_CRYPTO_LZ4 CONFIG_CRYPTO_ZSTD CONFIG_CPU_INPUT_BOOST CONFIG_DEVFREQ_BOOST CONFIG_IOSCHED_BFQ CONFIG_MQ_IOSCHED_DEADLINE CONFIG_MQ_IOSCHED_KYBER CONFIG_TCP_CONG_BBR2 CONFIG_TCP_CONG_BBR3 CONFIG_CPU_FREQ_GOV_SCHEDUTIL CONFIG_QCOM_KGSL CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_THREAD_INFO_IN_TASK CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL CONFIG_OVERLAY_FS CONFIG_KPROBES; do
            if ! grep -qx "${symbol}=y" out/.config; then
              echo "::error::Required kernel config missing: ${symbol}=y"
              exit 1
            fi
          done

          if ! grep -qx 'CONFIG_NR_LRU_GENS=7' out/.config; then
            echo "::error::Expected CONFIG_NR_LRU_GENS=7"
            exit 1
          fi
          if ! grep -qx 'CONFIG_TIERS_PER_GEN=4' out/.config; then
            echo "::error::Expected CONFIG_TIERS_PER_GEN=4"
            exit 1
          fi

          for ratio in ANON_MIN_RATIO CLEAN_LOW_RATIO CLEAN_MIN_RATIO; do
            if ! grep -qx "CONFIG_${ratio}=0" out/.config; then
              echo "::error::Expected CONFIG_${ratio}=0 so le9 remains inert"
              exit 1
            fi
          done

          if ! grep -qx 'CONFIG_QCOM_ADRENO_DEFAULT_GOVERNOR="msm-adreno-tz"' out/.config; then
            echo "::error::Expected CONFIG_QCOM_ADRENO_DEFAULT_GOVERNOR=\"msm-adreno-tz\""
            exit 1
          fi

          if grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
            echo "::error::CONFIG_KSU_MANUAL_HOOK must not be set for the SUSFS inline-hook build"
            exit 1
          fi

      - name: Compile root-hiding objects
        run: |
          set -euxo pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang-18 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            LLVM_IAS=0 prepare init/version.o

          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang-18 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            LLVM_IAS=0 \
            fs/susfs.o fs/exec.o fs/open.o fs/stat.o fs/read_write.o \
            fs/namei.o fs/namespace.o fs/proc/base.o fs/proc/fd.o \
            fs/proc/task_mmu.o fs/proc_namespace.o fs/readdir.o fs/statfs.o \
            kernel/sys.o kernel/reboot.o kernel/kallsyms.o \
            security/selinux/avc.o drivers/input/input.o drivers/kernelsu/

      - name: Compile kernel and device trees
        run: |
          set -euxo pipefail
          make -j"$(nproc)" O=out \
            ARCH=arm64 CC=clang-18 CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            LLVM_IAS=0 V=1 Image.gz-dtb

          test -s out/arch/arm64/boot/Image.gz-dtb
          test -s out/mm/vmscan.o
          llvm-nm-18 out/mm/vmscan.o > out/vmscan.nm
          awk '{print $NF}' out/vmscan.nm > out/vmscan.symbols
          grep -qx 'lru_gen_add_mm' out/vmscan.symbols
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "Kernel + MGLRU + BakaSU/SUSFS built."

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dipper-optimisasi-mglru-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/.config
